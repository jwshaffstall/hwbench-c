name: Linux CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset linux-gcc-release

      - name: Build
        run: cmake --build --preset linux-gcc-release

      - name: Test
        run: ctest --preset linux-gcc-release
