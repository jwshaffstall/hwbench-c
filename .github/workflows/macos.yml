name: macOS CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset macos-clang-release

      - name: Build
        run: cmake --build build/macos-clang-release

      - name: Test
        run: ctest --test-dir build/macos-clang-release --output-on-failure
