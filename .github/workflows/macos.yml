name: macOS CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure (release + max optimizations)
        run: cmake --preset macos-clang-release -D CMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -march=native"

      - name: Build
        run: cmake --build build/macos-clang-release

      - name: Test
        run: ctest --test-dir build/macos-clang-release --output-on-failure

      - name: Run benchmark executable (release max-opt)
        run: ./build/macos-clang-release/hwbench-c --suite quick --samples 1 --warmup-ms 5 --min-sample-ms 5
