name: Windows CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset windows-msvc-release

      - name: Build
        run: cmake --build build/windows-msvc-release --config Release

      - name: Test
        run: ctest --test-dir build/windows-msvc-release -C Release --output-on-failure
